services:
  dev:
    build:
      context: .
      target: development
    container_name: kanban-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host

  prod:
    build:
      context: .
      target: production
    container_name: kanban-prod
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  storybook:
    build:
      context: .
      target: development
    container_name: kanban-storybook
    ports:
      - "6006:6006"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run storybook
